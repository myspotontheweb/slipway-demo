apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-core
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux/infrastructure/core/dev1
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age    